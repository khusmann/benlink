// Vendor update server API, reconstructed from observed traffic.
//
// Field numbers are the contract; names here are our own. Only the firmware
// update check is modelled — the real service has other methods.
//
// Regenerate with `make proto`.

syntax = "proto3";

package benshikj;

message CheckFirmwareUpdateRequest {
  int32 product_id = 1;
  int32 firmware_version = 2;
  bool beta = 3;
  int64 user_id = 4;
  int32 invite_code = 5;
}

message FirmwareInfo {
  int32 version = 1;
  string url = 2;
  // Not the md5 of the file at `url`: for the patch this is the md5 of the
  // assembled firmware, and for the base it is the md5 of the .bin inside the zip.
  string md5 = 3;
  string release_notes = 4;
  string release_date = 5;
}

message CheckFirmwareUpdateResult {
  FirmwareInfo firmware = 1;
  FirmwareInfo base = 2;
}

service DeviceManagement {
  rpc CheckFirmwareUpdate(CheckFirmwareUpdateRequest)
      returns (CheckFirmwareUpdateResult);
}
